<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="left-side">
             <img src="halie-west-25xggax4bSA-unsplash.jpg" alt="leaf img" />
           <div class="credits">Photo by
            <a href="https://unsplash.com/@haliewestphoto" target="_blank" rel="noopener noreferrer"> Halie West </a>
               on <a href="https://unsplash.com/" target="_blank" rel="noopener noreferrer">  Unsplash</a></div>
            </div>

        <div class="right-side">
    <p>Let's get you signed-up!</p>
    <fieldset>
        <legend>Sign-up Form</legend>
        <div class="form-class">
            <label for="firstname">First Name:*</label>
            <input type="text" id="firstname" name="user-firstName" placeholder="Mary" required/>
        </div>

        <div class="form-class">
            <label for="lastname">Last Name:*</label>
            <input type="text" id="lastname" name="user-lastName" placeholder="Smith" required />
        </div>

        <div class="mail">
            <label for="email">Email:*</label>
            <input type="email" id="email" name="user-mail" placeholder="example.com" required />
        </div>

        <div class="form-class">
            <label for="number">Phone Number</label>
            <input type="text" inputmode="numeric" id="number" name="user-phone" pattern="\d*" />
        </div>

        <div class="form-class">
            <label for="psw">Password:*</label>
            <input type="password" id="psw" name="user-password" required />
        </div>
         
        <div class="form-class">
            <label for="confirmation">Confirm Password:*</label>
            <input type="password" id="confirmation" name="user-password-confirmation" required />
        </div>
         </fieldset>
        <div class="form-class">
        <button type="submit" class="signup">Create Account</button>
        </div>

        <p>Already have an account?</p>
        <button type="button" class="login">Log in</button>
       </div>
    </div>
</body>
</html>
